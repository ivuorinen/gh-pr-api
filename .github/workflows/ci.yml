name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Only to read the repository contents this job builds and tests. Nothing is published.
permissions:
  contents: read

# Supersede an in-flight run of the same ref: a push amending a PR makes the previous
# build's result irrelevant, and cancelling frees the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving the token in .git/config would expose it to every
          # later step and to anything that archives the workspace.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        id: test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      # Only when the tests actually ran: upload on pass or fail (coverage of a failing run is
      # still useful), but stay skipped if an earlier step died -- otherwise a restore failure
      # reports a second, misleading "no coverage found" error on an already-red run.
      - name: Upload coverage
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
