name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Workflow default is read-only; packages: write is granted per-job, to the one job that needs
# it, so a future job added here does not silently inherit registry write access.
permissions:
  contents: read

# Concurrency is per job, not per workflow, because the two want opposite things: superseding an
# in-flight test run is free, cancelling a publish half-pushed is not.
jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    # Supersede an in-flight run of the same ref: a push amending a PR makes the previous
    # build's result irrelevant, and cancelling frees the runner.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving the token in .git/config would expose it to every
          # later step and to anything that archives the workspace.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --locked-mode

      # Locked-mode restore guarantees reproducibility, not safety: it will faithfully restore a
      # known-vulnerable graph. This repository has shipped one already (GHSA-2m69-gcr7-jv3q via
      # a transitive), and the pins that fixed it are hand-maintained, so they need a check that
      # they still hold. --include-transitive is the point: both incidents were transitives.
      # `dotnet list package` exits 0 even when it finds something, so assert on the output.
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q 'has the following vulnerable packages' vulnerable.txt

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        id: test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      # Only when the tests actually ran: upload on pass or fail (coverage of a failing run is
      # still useful), but stay skipped if an earlier step died -- otherwise a restore failure
      # reports a second, misleading "no coverage found" error on an already-red run.
      - name: Upload coverage
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    # `needs`, not a second workflow: publishing used to live in its own file triggered by the
    # same push, so the two raced and `latest` -- the tag README tells Coolify to deploy -- could
    # be published from a commit whose tests were still running, or already red.
    needs: build-test
    # Never from a pull request: a fork PR must not be able to publish, and its token is
    # read-only anyway. Default branch and release tags only.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # Image publishes are not superseded: a tag build and a branch build produce different
    # artifacts, so let an in-flight publish finish rather than cancelling it half-pushed.
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read # read the repository being built
      packages: write # push the built image to ghcr.io via GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build never pushes commits; keeping the token out of .git/config stops it
          # leaking into the Docker build context or any later step.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
